<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Fibrous paper grain -->
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="4" seed="7" stitchTiles="stitch" result="fibers" />
      <feColorMatrix in="fibers" type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.47
                0 0 0 0 0.33
                0 0 0 0.06 0" result="grain" />
      <feComposite in="grain" in2="SourceGraphic" operator="over" />
    </filter>
    <!-- Broad mottling / age staining -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="19" result="clouds" />
      <feColorMatrix in="clouds" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.33
                0 0 0 0 0.18
                0 0 0 0.10 0" />
    </filter>
    <radialGradient id="vignette" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#f6eed9" />
      <stop offset="60%" stop-color="#efe4ca" />
      <stop offset="100%" stop-color="#e3d3ac" />
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="#f2e8d1" />
  <rect width="1200" height="1600" fill="url(#vignette)" />
  <rect width="1200" height="1600" filter="url(#mottle)" opacity="0.32" />
  <rect width="1200" height="1600" filter="url(#paperGrain)" opacity="0.3" />

  <!-- A couple of soft coffee-ring / age blooms for character -->
  <circle cx="980" cy="240" r="120" fill="#c9b184" opacity="0.05" />
  <circle cx="180" cy="1280" r="160" fill="#bfa06a" opacity="0.04" />
  <circle cx="640" cy="820" r="220" fill="#d8c79b" opacity="0.03" />
</svg>
